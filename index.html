<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziennik nawyków</title>
</head>
<body>
<h1>Dziennik nawyków</h1>

<form id="form">
  <label>Data: <input type="date" name="data" required></label><br>
  <label>Kategoria:
    <select name="kategoria" required>
      <option value="trening">trening</option>
      <option value="jedzenie">jedzenie</option>
      <option value="sen">sen</option>
      <option value="czytanie">czytanie</option>
      <option value="trading">trading</option>
    </select>
  </label><br>
  <label>Wartość: <input type="text" name="wartosc" required></label><br>
  <label>Notatka: <input type="text" name="notatka"></label><br>
  <button type="submit">Dodaj</button>
</form>

<ul id="lista"></ul>

<script>
  const form = document.getElementById('form');
  const lista = document.getElementById('lista');
  const KLUCZ = 'wpisy';

  let wpisy = JSON.parse(localStorage.getItem(KLUCZ) || '[]');

  function tekst(w) {
    return w.data + ' | ' + w.kategoria + ' | ' + w.wartosc +
      (w.notatka ? ' | ' + w.notatka : '');
  }

  function render() {
    lista.innerHTML = '';
    wpisy.forEach(function (w) {
      const li = document.createElement('li');
      li.textContent = tekst(w);
      lista.appendChild(li);
    });
  }

  render();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const d = new FormData(form);
    wpisy.push({
      data: d.get('data'),
      kategoria: d.get('kategoria'),
      wartosc: d.get('wartosc'),
      notatka: d.get('notatka')
    });
    localStorage.setItem(KLUCZ, JSON.stringify(wpisy));
    render();
    form.reset();
  });
</script>
</body>
</html>
