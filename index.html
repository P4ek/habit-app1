<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: oklch(0.15 0.025 255);
    --card: oklch(0.185 0.025 255);
    --tile: oklch(0.23 0.022 255);
    --border: oklch(1 0 0 / 0.06);
    --text: oklch(0.96 0.005 255);
    --muted: oklch(0.68 0.015 255);
    --accent: #E6A94A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  .wrap { max-width: 940px; margin: 0 auto; }

  header { margin-bottom: 32px; }

  h1 {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 34px;
    margin: 0;
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 500;
    color: var(--muted);
    margin-top: 4px;
  }

  .cols {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 24px;
  }

  .form-card { width: 360px; flex-shrink: 0; }
  .list-card { flex: 1; min-width: 0; }

  h2 {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 16px;
  }

  .field { margin-bottom: 16px; }

  .field > label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="date"],
  input[type="text"] {
    width: 100%;
    padding: 11px 14px;
    border-radius: 14px;
    background: var(--tile);
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
  }

  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .picker {
    display: flex;
    gap: 8px;
  }

  .cat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 4px;
    border-radius: 14px;
    background: var(--tile);
    border: 1px solid transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }

  .cat .ico { font-size: 20px; line-height: 1; }

  .cat:hover { color: var(--text); }

  .cat.active {
    background: color-mix(in oklch, var(--accent) 16%, var(--card));
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn {
    width: 100%;
    margin-top: 4px;
    padding: 13px 20px;
    border-radius: 999px;
    background: var(--accent);
    color: oklch(0.2 0.04 70);
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 15px;
    border: none;
    cursor: pointer;
  }

  .btn:hover { filter: brightness(1.06); }

  .empty { color: var(--muted); font-size: 14px; }

  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 16px;
    background: var(--tile);
  }

  .entry + .entry { margin-top: 8px; }

  .entry .circle {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 18px;
    background: color-mix(in oklch, var(--accent) 14%, transparent);
  }

  .entry .body { flex: 1; min-width: 0; }

  .entry .cat-name {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
  }

  .entry .meta { font-size: 12px; color: var(--muted); }
  .entry .note { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .entry .val {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--accent);
    flex-shrink: 0;
  }

  @media (max-width: 720px) {
    .cols { flex-direction: column; }
    .form-card { width: 100%; }
    .list-card { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Habits</h1>
    <div class="subtitle">Codzienny dziennik nawyków</div>
  </header>

  <div class="cols">
    <div class="card form-card">
      <h2>Nowy wpis</h2>
      <form id="form">
        <div class="field">
          <label for="data">Data</label>
          <input type="date" id="data" name="data" required>
        </div>

        <div class="field">
          <label>Kategoria</label>
          <div class="picker" id="picker"></div>
        </div>

        <div class="field">
          <label for="wartosc">Wartość</label>
          <input type="text" id="wartosc" name="wartosc" required>
        </div>

        <div class="field">
          <label for="notatka">Notatka</label>
          <input type="text" id="notatka" name="notatka">
        </div>

        <input type="hidden" name="kategoria" id="kategoria">
        <button type="submit" class="btn">Dodaj wpis</button>
      </form>
    </div>

    <div class="card list-card">
      <h2>Wpisy</h2>
      <div id="lista"></div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('form');
  const lista = document.getElementById('lista');
  const picker = document.getElementById('picker');
  const kategoriaInput = document.getElementById('kategoria');
  const KLUCZ = 'wpisy';

  const KATEGORIE = [
    { id: 'jedzenie', nazwa: 'Jedzenie', ikona: '🍽️' },
    { id: 'trening',  nazwa: 'Trening',  ikona: '🏋️' },
    { id: 'sen',      nazwa: 'Sen',      ikona: '🌙' },
    { id: 'czytanie', nazwa: 'Czytanie', ikona: '📖' },
    { id: 'trading',  nazwa: 'Trading',  ikona: '📈' }
  ];

  let wpisy = JSON.parse(localStorage.getItem(KLUCZ) || '[]');

  // Budowa wyboru kategorii (ikony zamiast <select>)
  KATEGORIE.forEach(function (k) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat';
    b.innerHTML = '<span class="ico">' + k.ikona + '</span>';
    b.appendChild(document.createTextNode(k.nazwa));
    b.addEventListener('click', function () {
      kategoriaInput.value = k.id;
      picker.querySelectorAll('.cat').forEach(function (el) { el.classList.remove('active'); });
      b.classList.add('active');
    });
    picker.appendChild(b);
  });

  function render() {
    lista.innerHTML = '';
    if (wpisy.length === 0) {
      const p = document.createElement('div');
      p.className = 'empty';
      p.textContent = 'Brak wpisów.';
      lista.appendChild(p);
      return;
    }
    wpisy.forEach(function (w) {
      const k = KATEGORIE.find(function (x) { return x.id === w.kategoria; }) ||
        { nazwa: w.kategoria, ikona: '•' };

      const el = document.createElement('div');
      el.className = 'entry';
      el.innerHTML =
        '<div class="circle"></div>' +
        '<div class="body">' +
          '<div class="cat-name"></div>' +
          '<div class="meta"></div>' +
          (w.notatka ? '<div class="note"></div>' : '') +
        '</div>' +
        '<div class="val"></div>';

      el.querySelector('.circle').textContent = k.ikona;
      el.querySelector('.cat-name').textContent = k.nazwa;
      el.querySelector('.meta').textContent = w.data;
      if (w.notatka) el.querySelector('.note').textContent = w.notatka;
      el.querySelector('.val').textContent = w.wartosc;

      lista.appendChild(el);
    });
  }

  render();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const d = new FormData(form);
    if (!d.get('kategoria')) {
      alert('Wybierz kategorię');
      return;
    }
    wpisy.push({
      data: d.get('data'),
      kategoria: d.get('kategoria'),
      wartosc: d.get('wartosc'),
      notatka: d.get('notatka')
    });
    localStorage.setItem(KLUCZ, JSON.stringify(wpisy));
    render();
    form.reset();
    kategoriaInput.value = '';
    picker.querySelectorAll('.cat').forEach(function (el) { el.classList.remove('active'); });
  });
</script>
</body>
</html>
